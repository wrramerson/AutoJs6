name: Build AutoJs6 APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Tipo de build"
        required: true
        default: "debug"
        type: choice
        options:
          - debug
          - release

  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build AutoJs6
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Show environment
        run: |
          java -version
          ./gradlew --version

          echo "=== Android Gradle Plugin ==="
          grep -R "com.android.tools.build:gradle" -n --include="*.gradle" --include="*.gradle.kts" . || true

          echo "=== Kotlin Gradle Plugin ==="
          grep -R "org.jetbrains.kotlin" -n --include="*.gradle" --include="*.gradle.kts" . || true

          echo "=== Version properties ==="
          cat version.properties

      - name: Build Debug APK
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_type == 'debug' }}
        run: |
          ./gradlew :app:assembleDebug --stacktrace

      - name: Build Release APK
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_type == 'release' }}
        run: |
          ./gradlew :app:assembleRelease --stacktrace

      - name: Find APK
        run: |
          echo "=== APKs encontrados ==="
          find . -type f -name "*.apk" -print

      - name: Upload Debug APK
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_type == 'debug' }}
        uses: actions/upload-artifact@v6
        with:
          name: AutoJs6-debug
          path: |
            app/build/outputs/apk/**/*.apk
            app/build/outputs/apk/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload Release APK
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_type == 'release' }}
        uses: actions/upload-artifact@v6
        with:
          name: AutoJs6-release
          path: |
            app/build/outputs/apk/**/*.apk
            app/build/outputs/apk/*.apk
          if-no-files-found: error
          retention-days: 7
